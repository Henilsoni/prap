<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,sans-serif;background:#1a0f1f;color:#fff;text-align:center;padding:20px}
  .box{max-width:420px}
  .heart{font-size:56px;animation:beat 1s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
  p{opacity:.85;line-height:1.5}
</style>
</head>
<body>
<div class="box">
  <div class="heart">💌</div>
  <p id="msg">Opening…</p>
</div>
<script>
(function () {
  var msg = document.getElementById("msg");

  // Accept a full link OR just the code part (e.g. "random-words-here").
  function normalize(value) {
    value = String(value || "").trim();
    if (!value || value.indexOf("PASTE-YOUR") !== -1) return null;
    if (value.indexOf(".") === -1) value = "https://" + value + ".trycloudflare.com";
    if (!/^https?:\/\//i.test(value)) value = "https://" + value;
    try {
      var u = new URL(value);
      // Safety: only ever redirect to Cloudflare quick-tunnel addresses.
      if (u.protocol === "https:" && /^[a-z0-9-]+\.trycloudflare\.com$/i.test(u.hostname)) {
        return u.origin + "/";
      }
    } catch (e) {}
    return null;
  }

  function go(url) {
    msg.textContent = "Opening your surprise…";
    location.replace(url);
  }

  function fail() {
    msg.textContent = "The link is not ready right now. Please try again in a little while 💗";
  }

  // 1) Optional override: https://you.github.io/repo/?c=random-words-here
  var param = new URLSearchParams(location.search).get("c");
  var fromParam = normalize(param);
  if (fromParam) return go(fromParam);

  // 2) Normal case: read the link you pasted into link.json
  fetch("link.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var url = normalize(data.url);
      if (url) go(url); else fail();
    })
    .catch(fail);
})();
</script>
</body>
</html>
